<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a47aee67-fdaa-4e03-a77c-7f99e9477d92"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono Academy | Learn Finance & Business</title>
    <style>
        /* Custom Modern Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc; color: #0f172a; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* Banzai-style Sidebar Navigation */
        .sidebar { 
            width: 300px; background: #ffffff; color: #0f172a; padding: 24px 20px; 
            box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; 
            flex-shrink: 0; border-right: 1px solid #e2e8f0;
        }

        .sidebar-brand {
            margin: 0 0 24px 0; font-size: 24px; color: #0284c7; cursor: pointer; 
            letter-spacing: -0.03em; font-weight: 800; display: flex; align-items: center; gap: 8px;
        }

        .sidebar-brand-icon {
            background: #0284c7; color: white; width: 32px; height: 32px; 
            border-radius: 8px; display: inline-flex; align-items: center; 
            justify-content: center; font-size: 16px; font-weight: 900;
        }

        .sidebar-menu { flex-grow: 1; overflow-y: auto; padding-right: 4px; }

        .main-content { 
            flex: 1; padding: 36px 48px; overflow-y: auto; background: #f8fafc; 
            height: 100vh; box-sizing: border-box; 
        }

        .workbook-viewport { 
            background: #ffffff; padding: 40px; border-radius: 20px; 
            box-shadow: 0 4px 25px rgba(15, 23, 42, 0.03); max-width: 900px; 
            margin: 0 auto; border: 1px solid #e2e8f0; 
        }

        /* Buttons & Navigation Items */
        .nav-btn { 
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; text-align: left; background: transparent; border: none; 
            color: #475569; padding: 10px 14px; cursor: pointer; font-size: 13.5px; 
            border-radius: 10px; transition: all 0.15s ease; margin-bottom: 2px; font-weight: 600;
        }

        .nav-btn:hover, .nav-btn.active { background: #f0f9ff; color: #0284c7; }
        .nav-btn.active span { font-weight: 700; color: #0284c7; }

        .completion-dot { 
            width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; flex-shrink: 0;
        }
        .nav-btn.completed .completion-dot { background: #10b981; }

        .accordion-header {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            background: none; border: none; color: #0f172a; font-size: 12px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 8px; cursor: pointer;
            margin-top: 12px; border-radius: 8px; transition: background 0.2s;
        }
        .accordion-header:hover { background: #f1f5f9; }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.open { max-height: 500px; transition: max-height 0.4s ease-in; }

        .accordion-arrow { transition: transform 0.2s ease; font-size: 10px; color: #64748b; }
        .accordion-header.active .accordion-arrow { transform: rotate(90deg); }

        /* Banzai-Inspired Hero & Cards */
        .hero-banner {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border-radius: 20px; color: white; padding: 36px; margin-bottom: 36px;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.25); position: relative; overflow: hidden;
        }

        .hero-title { font-size: 28px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.02em; }
        .hero-desc { font-size: 15px; opacity: 0.9; margin: 0 0 24px 0; max-width: 550px; line-height: 1.5; }

        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }

        .course-card {
            background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 24px;
            transition: all 0.2s ease; position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }

        .course-card.active-course { border-color: #38bdf8; box-shadow: 0 8px 20px -4px rgba(56, 189, 248, 0.15); }
        .course-card.coming-soon { background: #f8fafc; border-color: #f1f5f9; opacity: 0.85; }

        .badge-tag {
            display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase;
            padding: 4px 10px; border-radius: 99px; letter-spacing: 0.05em; width: fit-content; margin-bottom: 12px;
        }

        .badge-active { background: #e0f2fe; color: #0369a1; }
        .badge-soon { background: #fef3c7; color: #b45309; }

        .course-card h3 { font-size: 18px; font-weight: 800; margin: 0 0 8px 0; color: #0f172a; }
        .course-card p { font-size: 13.5px; color: #64748b; margin: 0 0 20px 0; line-height: 1.4; }

        .notes-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
        .journal-note-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; position: relative; }
        .journal-note-quote { font-size: 13px; font-style: italic; color: #64748b; border-left: 3px solid #38bdf8; padding-left: 12px; margin-bottom: 12px; }
        .journal-note-text { font-size: 14px; color: #1e293b; font-weight: 500; }
        .delete-journal-btn { position: absolute; top: 16px; right: 16px; background: #fee2e2; color: #ef4444; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .floating-note-popup {
            position: absolute; background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 16px; width: 280px; z-index: 1000; display: none;
        }
        .floating-note-popup textarea { width: 100%; height: 70px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; resize: none; box-sizing: border-box; outline: none; font-family: inherit; }

        .lesson-footer-bar { margin-top: 40px; padding-top: 24px; border-top: 2px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-brand" onclick="loadDashboard()">
                <span class="sidebar-brand-icon">M</span> Mono Academy
            </div>
            
            <button class="nav-btn active" id="dashboard-nav-btn" onclick="loadDashboard()" style="margin-bottom: 16px; padding: 12px 14px;">
                <span style="font-size: 14px; font-weight: 700;">🏠 Dashboard Overview</span>
            </button>

            <div class="sidebar-menu">
                <div style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 8px;">
                    Accounting Course
                </div>

                <button class="accordion-header active" onclick="toggleAccordion('module1-content', this)">
                    <span>Module 1: Basics</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module1-content" class="accordion-content open">
                    <button class="nav-btn" id="nav-1.1" onclick="loadLessonContent('1.1')">
                        <span>1.1: Introduction</span><span class="completion-dot"></span>
                    </button>
                    <button class="nav-btn" id="nav-1.2" onclick="loadLessonContent('1.2')">
                        <span>1.2: Accounting Equation</span><span class="completion-dot"></span>
                    </button>
                    <button class="nav-btn" id="nav-1.3" onclick="loadLessonContent('1.3')">
                        <span>1.3: T-Accounts System</span><span class="completion-dot"></span>
                    </button>
                    <button class="nav-btn" id="nav-1.4" onclick="loadLessonContent('1.4')">
                        <span>1.4: Journal and Ledger</span><span class="completion-dot"></span>
                    </button>
                    <button class="nav-btn" id="nav-1.5" onclick="loadLessonContent('1.5')">
                        <span>1.5: The Trial Balance</span><span class="completion-dot"></span>
                    </button>
                    <button class="nav-btn" id="nav-1.6" onclick="loadLessonContent('1.6')">
                        <span>1.6: Review and Quiz</span><span class="completion-dot"></span>
                    </button>
                </div>

                <button class="accordion-header" onclick="toggleAccordion('module2-content', this)">
                    <span>Module 2: Financial Statements</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module2-content" class="accordion-content">
                    <button class="nav-btn" id="nav-2.1" onclick="loadLessonContent('2.1')"><span>2.1: Intro to Statements</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-2.2" onclick="loadLessonContent('2.2')"><span>2.2: Income Statement</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-2.3" onclick="loadLessonContent('2.3')"><span>2.3: Balance Sheet</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-2.4" onclick="loadLessonContent('2.4')"><span>2.4: Owner's Equity</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-2.5" onclick="loadLessonContent('2.5')"><span>2.5: Cash Flow Statement</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-2.6" onclick="loadLessonContent('2.6')"><span>2.6: Module 2 Capstone</span><span class="completion-dot"></span></button>
                </div>

                <button class="accordion-header" onclick="toggleAccordion('module3-content', this)">
                    <span>Module 3: Ratio & Health</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module3-content" class="accordion-content">
                    <button class="nav-btn" id="nav-3.1" onclick="loadLessonContent('3.1')"><span>3.1: Liquidity & Capital</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-3.2" onclick="loadLessonContent('3.2')"><span>3.2: Profitability Ratios</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-3.3" onclick="loadLessonContent('3.3')"><span>3.3: Efficiency Ratios</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-3.4" onclick="loadLessonContent('3.4')"><span>3.4: Solvency Ratios</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-3.5" onclick="loadLessonContent('3.5')"><span>3.5: Reading Annual Reports</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-3.6" onclick="loadLessonContent('3.6')"><span>3.6: Investor Analysis</span><span class="completion-dot"></span></button>
                </div>

                <button class="accordion-header" onclick="toggleAccordion('module4-content', this)">
                    <span>Module 4: Assets & Equity</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module4-content" class="accordion-content">
                    <button class="nav-btn" id="nav-4.1" onclick="loadLessonContent('4.1')"><span>4.1: Inventory Costing</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-4.2" onclick="loadLessonContent('4.2')"><span>4.2: Depreciation</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-4.3" onclick="loadLessonContent('4.3')"><span>4.3: Bad Debt</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-4.4" onclick="loadLessonContent('4.4')"><span>4.4: Liabilities</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-4.5" onclick="loadLessonContent('4.5')"><span>4.5: Corporate Equity</span><span class="completion-dot"></span></button>
                </div>

                <button class="accordion-header" onclick="toggleAccordion('module5-content', this)">
                    <span>Module 5: Advanced</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module5-content" class="accordion-content">
                    <button class="nav-btn" id="nav-5.1" onclick="loadLessonContent('5.1')"><span>5.1: Business Combinations</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-5.2" onclick="loadLessonContent('5.2')"><span>5.2: Deferred Taxes</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-5.3" onclick="loadLessonContent('5.3')"><span>5.3: Advanced Instruments</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-5.4" onclick="loadLessonContent('5.4')"><span>5.4: Revenue Recognition</span><span class="completion-dot"></span></button>
                    <button class="nav-btn" id="nav-5.5" onclick="loadLessonContent('5.5')"><span>5.5: Forensic Accounting</span><span class="completion-dot"></span></button>
                </div>

                <button class="accordion-header" onclick="toggleAccordion('module-final-content', this)">
                    <span>Final Milestone</span>
                    <span class="accordion-arrow">▶</span>
                </button>
                <div id="module-final-content" class="accordion-content">
                    <button class="nav-btn" id="nav-final_exam" onclick="loadLessonContent('final_exam')">
                        <span>🎓 Final Examination</span><span class="completion-dot"></span>
                    </button>
                </div>
            </div>

            <div style="border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: auto;">
                <button class="nav-btn" id="nav-notes" onclick="loadNotesPage()">
                    <span style="display: flex; align-items: center; gap: 8px;">📝 Study Notes</span>
                    <span id="notes-counter-badge" style="background: #e2e8f0; color: #0f172a; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px;">0</span>
                </button>
            </div>
        </div>

        <div class="main-content" id="main-scroll-viewport">
            <div id="workbook-content-area" class="workbook-viewport">
                </div>
        </div>
    </div>

    <div id="floating-note-box" class="floating-note-popup">
        <div style="font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 6px;">Add Note to Selection:</div>
        <div id="popup-selected-text" style="font-size: 12px; font-style: italic; color: #475569; background: #f8fafc; padding: 6px; border-radius: 6px; border-left: 2px solid #cbd5e1; margin-bottom: 10px; max-height: 50px; overflow-y: auto; line-height: 1.3;"></div>
        <textarea id="popup-note-input" placeholder="Enter your note here..."></textarea>
        <div style="display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end;">
            <button onclick="closeNotePopup()" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Cancel</button>
            <button onclick="saveNote()" style="background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Save</button>
        </div>
    </div>

    <script>
        let completedLessons = JSON.parse(localStorage.getItem('mono_completed_lessons')) || [];
        let studyNotes = JSON.parse(localStorage.getItem('mono_study_notes')) || [];
        let selectedQuoteText = ""; 
        let currentLessonId = null;
        
        const curriculum = [
            { id: "1.1", module: 1, name: "Lesson 1.1: Introduction", desc: "Foundational concepts and basic accounting principles." },
            { id: "1.2", module: 1, name: "Lesson 1.2: Accounting Equation", desc: "Assets, Liabilities, and Owner's Equity balance." },
            { id: "1.3", module: 1, name: "Lesson 1.3: T-Accounts System", desc: "Visualize debits and credits clearly." },
            { id: "1.4", module: 1, name: "Lesson 1.4: Journal and Ledger", desc: "Record and post financial transactions." },
            { id: "1.5", module: 1, name: "Lesson 1.5: The Trial Balance", desc: "Verify ledger accuracy before statements." },
            { id: "1.6", module: 1, name: "Lesson 1.6: Review and Quiz", desc: "Test your understanding of Module 1." },
            
            { id: "2.1", module: 2, name: "Lesson 2.1: Intro to Financial Statements", desc: "Overview of core financial statements." },
            { id: "2.2", module: 2, name: "Lesson 2.2: Income Statement", desc: "Revenues, expenses, and net income." },
            { id: "2.3", module: 2, name: "Lesson 2.3: Balance Sheet", desc: "Organize assets, liabilities, and equity." },
            { id: "2.4", module: 2, name: "Lesson 2.4: Statement of Owner's Equity", desc: "Track capital changes over time." },
            { id: "2.5", module: 2, name: "Lesson 2.5: Cash Flow Statement", desc: "Track cash from operating, investing, and financing." },
            { id: "2.6", module: 2, name: "Lesson 2.6: Module 2 Capstone", desc: "Construct integrated financial statements." },
            
            { id: "3.1", module: 3, name: "Lesson 3.1: Liquidity & Capital", desc: "Short-term financial health and liquidity ratios." },
            { id: "3.2", module: 3, name: "Lesson 3.2: Profitability Ratios", desc: "Assess margins and overall profit performance." },
            { id: "3.3", module: 3, name: "Lesson 3.3: Efficiency Ratios", desc: "Evaluate operational velocity and asset turns." },
            { id: "3.4", module: 3, name: "Lesson 3.4: Solvency Ratios", desc: "Long-term debt and structural solvency." },
            { id: "3.5", module: 3, name: "Lesson 3.5: Reading Annual Reports", desc: "Key disclosures inside a 10-K report." },
            { id: "3.6", module: 3, name: "Lesson 3.6: Investor Analysis", desc: "Evaluate target companies." },

            { id: "4.1", module: 4, name: "Lesson 4.1: Inventory Costing Methods", desc: "FIFO, LIFO, and Weighted Average." },
            { id: "4.2", module: 4, name: "Lesson 4.2: Depreciation & Amortization", desc: "Asset allocation rules and straight-line methods." },
            { id: "4.3", module: 4, name: "Lesson 4.3: Bad Debt", desc: "Loss allowances and aging analysis." },
            { id: "4.4", module: 4, name: "Lesson 4.4: Liabilities", desc: "Current obligations vs. long-term debt." },
            { id: "4.5", module: 4, name: "Lesson 4.5: Corporate Equity", desc: "Capital stock, retained earnings, and treasury stock." },

            { id: "5.1", module: 5, name: "Lesson 5.1: Business Combinations", desc: "Mergers, acquisitions, and consolidated tracking." },
            { id: "5.2", module: 5, name: "Lesson 5.2: Deferred Taxes", desc: "Tax obligations vs. book-value accounting." },
            { id: "5.3", module: 5, name: "Lesson 5.3: Advanced Instruments", desc: "Financial derivatives and hedging techniques." },
            { id: "5.4", module: 5, name: "Lesson 5.4: Revenue Recognition", desc: "IFRS vs. US GAAP standards." },
            { id: "5.5", module: 5, name: "Lesson 5.5: Forensic Accounting", desc: "Data investigation and auditing internal controls." },
            
            { id: "final_exam", module: 6, name: "Final Examination", desc: "Comprehensive exam covering all topics." }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            updateSidebarVisuals();
            updateNotesBadge();
            initHighlightListener();
        });

        function toggleAccordion(id, btn) {
            const panel = document.getElementById(id);
            btn.classList.toggle('active');
            panel.classList.toggle('open');
        }

        function updateNotesBadge() {
            const badge = document.getElementById("notes-counter-badge");
            if (badge) {
                badge.textContent = studyNotes.length;
                badge.style.background = studyNotes.length > 0 ? "#0284c7" : "#e2e8f0";
                badge.style.color = studyNotes.length > 0 ? "#ffffff" : "#0f172a";
            }
        }

        function loadDashboard() {
            currentLessonId = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('dashboard-nav-btn').classList.add('active');
            document.getElementById("main-scroll-viewport").scrollTop = 0;

            const container = document.getElementById("workbook-content-area");
            const totalCount = curriculum.length;
            const completedCount = completedLessons.length;
            const progressPercent = Math.round((completedCount / totalCount) * 100);

            container.innerHTML = `
                <div class="hero-banner">
                    <h1 class="hero-title">Welcome back to Mono Academy! 🚀</h1>
                    <p class="hero-desc">Master financial literacy, business principles, and accounting at your own pace. All your progress is automatically saved locally.</p>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="background: rgba(255, 255, 255, 0.2); height: 10px; width: 220px; border-radius: 99px; overflow: hidden;">
                            <div style="width: ${progressPercent}%; height: 100%; background: #ffffff;"></div>
                        </div>
                        <span style="font-weight: 800; font-size: 14px;">${progressPercent}% Complete (${completedCount}/${totalCount} Lessons)</span>
                    </div>
                </div>

                <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: #0f172a;">Courses Catalog</h2>
                
                <div class="course-grid">
                    <div class="course-card active-course">
                        <div>
                            <span class="badge-tag badge-active">Available Now</span>
                            <h3>Financial Accounting</h3>
                            <p>From debit/credit fundamentals to advanced forensic accounting and corporate financial statements.</p>
                        </div>
                        <button onclick="loadLessonContent('${completedLessons.length > 0 ? completedLessons[completedLessons.length - 1] : '1.1'}')" 
                                style="background: #0284c7; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer;">
                            ${completedCount > 0 ? 'Continue Learning →' : 'Start Course →'}
                        </button>
                    </div>

                    <div class="course-card coming-soon">
                        <div>
                            <span class="badge-tag badge-soon">Coming Soon</span>
                            <h3>Personal Finance</h3>
                            <p>Master budgeting, credit scores, smart investing, debt management, and building wealth for the future.</p>
                        </div>
                        <button disabled style="background: #e2e8f0; color: #94a3b8; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: not-allowed;">
                            Locked
                        </button>
                    </div>

                    <div class="course-card coming-soon">
                        <div>
                            <span class="badge-tag badge-soon">Coming Soon</span>
                            <h3>Business Analytics</h3>
                            <p>Learn data-driven decision making, key performance indicators (KPIs), modeling, and market metrics.</p>
                        </div>
                        <button disabled style="background: #e2e8f0; color: #94a3b8; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: not-allowed;">
                            Locked
                        </button>
                    </div>
                </div>
            `;
        }

        function loadLessonContent(lessonId) {
            currentLessonId = lessonId;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-${lessonId}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById("main-scroll-viewport").scrollTop = 0;
            const container = document.getElementById("workbook-content-area");
            
            let fileName = lessonId === "final_exam" 
                ? `lessons/final_exam.html?t=${Date.now()}` 
                : `lessons/Lesson${String(lessonId).split('.')[0]}_${String(lessonId).split('.')[1]}.html?t=${Date.now()}`;

            fetch(fileName, { cache: "no-store" })
                .then(response => {
                    if (!response.ok) throw new Error(`Missing page file: ${fileName}`);
                    return response.text();
                })
                .then(html => {
                    const isCompleted = completedLessons.includes(lessonId);
                    const footerHtml = `
                        <div class="lesson-footer-bar">
                            <span style="font-size: 13.5px; color: #64748b; font-weight: 600;">
                                ${isCompleted ? '✓ Lesson Completed' : 'Finished reading? Mark as complete:'}
                            </span>
                            <button id="complete-btn" onclick="toggleLessonCompletion('${lessonId}')" 
                                    style="background: ${isCompleted ? '#dcfce7' : '#0284c7'}; color: ${isCompleted ? '#166534' : '#ffffff'}; border: 1px solid ${isCompleted ? '#86efac' : '#0284c7'}; padding: 10px 20px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer;">
                                ${isCompleted ? '✓ Completed' : 'Complete & Continue →'}
                            </button>
                        </div>
                    `;
                    container.innerHTML = html + footerHtml;
                    updateSidebarVisuals();
                })
                .catch(err => {
                    container.innerHTML = `<div style="text-align: center; padding: 40px;"><h3 style="color:#ef4444;">Lesson Not Found</h3><p style="color:#64748b;">${err.message}</p></div>`;
                });
        }

        function toggleLessonCompletion(lessonId) {
            if (!completedLessons.includes(lessonId)) {
                completedLessons.push(lessonId);
            } else {
                completedLessons = completedLessons.filter(id => id !== lessonId);
            }
            localStorage.setItem('mono_completed_lessons', JSON.stringify(completedLessons));
            updateSidebarVisuals();

            const currentIndex = curriculum.findIndex(l => l.id === lessonId);
            if (completedLessons.includes(lessonId) && currentIndex !== -1 && currentIndex < curriculum.length - 1) {
                loadLessonContent(curriculum[currentIndex + 1].id);
            } else {
                loadLessonContent(lessonId);
            }
        }

        function updateSidebarVisuals() {
            curriculum.forEach(lesson => {
                const btn = document.getElementById(`nav-${lesson.id}`);
                if (btn) {
                    if (completedLessons.includes(lesson.id)) {
                        btn.classList.add('completed');
                    } else {
                        btn.classList.remove('completed');
                    }
                }
            });
        }

        function initHighlightListener() {
            document.addEventListener('mouseup', (e) => {
                const selectedText = window.getSelection().toString().trim();
                const popup = document.getElementById('floating-note-box');
                if (selectedText.length > 3 && !popup.contains(e.target)) {
                    selectedQuoteText = selectedText;
                    document.getElementById('popup-selected-text').textContent = `"${selectedText}"`;
                    popup.style.left = `${Math.min(e.pageX, window.innerWidth - 300)}px`;
                    popup.style.top = `${e.pageY + 10}px`;
                    popup.style.display = 'block';
                }
            });
        }

        function closeNotePopup() {
            document.getElementById('floating-note-box').style.display = 'none';
            document.getElementById('popup-note-input').value = '';
            selectedQuoteText = "";
        }

        function saveNote() {
            const input = document.getElementById('popup-note-input').value.trim();
            if (input && selectedQuoteText) {
                studyNotes.push({ id: Date.now(), quote: selectedQuoteText, text: input, date: new Date().toLocaleDateString() });
                localStorage.setItem('mono_study_notes', JSON.stringify(studyNotes));
                updateNotesBadge();
                closeNotePopup();
            }
        }

        function loadNotesPage() {
            currentLessonId = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-notes').classList.add('active');
            
            const container = document.getElementById("workbook-content-area");
            let notesHtml = studyNotes.length === 0 
                ? `<p style="color: #64748b; font-style: italic;">No study notes saved yet. Highlight any text in a lesson to add a note.</p>`
                : `<div class="notes-grid">` + studyNotes.map(note => `
                    <div class="journal-note-card">
                        <button class="delete-journal-btn" onclick="deleteNote(${note.id})">Delete</button>
                        <div class="journal-note-quote">"${note.quote}"</div>
                        <div class="journal-note-text">${note.text}</div>
                        <div style="font-size: 11px; color: #94a3b8; margin-top: 10px;">${note.date}</div>
                    </div>
                `).join('') + `</div>`;

            container.innerHTML = `
                <h1 style="margin: 0 0 6px 0; font-size: 26px; font-weight: 800; color: #0f172a;">📝 My Study Notes</h1>
                <p style="color: #64748b; margin-top: 0; margin-bottom: 24px;">Your saved highlights and study notes.</p>
                ${notesHtml}
            `;
        }

        function deleteNote(id) {
            studyNotes = studyNotes.filter(n => n.id !== id);
            localStorage.setItem('mono_study_notes', JSON.stringify(studyNotes));
            updateNotesBadge();
            loadNotesPage();
        }
    </script>
</body>
</html>
