<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a47aee67-fdaa-4e03-a77c-7f99e9477d92"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono Academy</title>
    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb {
            background: #bae6fd;
            border-radius: 99px;
            border: 2px solid #f1f5f9;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8; 
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
        }
        
        .sidebar { 
            width: 320px; 
            background: #e0f2fe; 
            color: #0f172a; 
            padding: 24px 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            flex-shrink: 0;
            border-right: 1px solid #bae6fd;
        }

        .sidebar-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar-brand-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
        }

        /* LOGO PLACED TO THE LEFT & ENLARGED */
        .sidebar-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .sidebar-brand {
            margin: 0;
            font-size: 24px;
            color: #0369a1;
            letter-spacing: -0.02em;
            font-weight: 800;
            display: inline-block;
        }

        .sidebar-menu { 
            flex-grow: 1; 
            overflow-y: auto; 
            margin-bottom: 16px; 
            padding-right: 4px;
        }

        .main-content { 
            flex: 1; 
            padding: 36px; 
            overflow-y: auto; 
            background: #f1f5f9; 
            height: 100vh;
            box-sizing: border-box;
        }
        
        .workbook-viewport { 
            background: #ffffff; 
            padding: 36px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04); 
            max-width: 820px; 
            margin: 0 auto; 
            min-height: 420px; 
            position: relative; 
            border: 1px solid #e2e8f0;
        }
        
        .nav-btn { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            text-align: left; 
            background: transparent; 
            border: none; 
            color: #1e293b; 
            padding: 10px 12px; 
            cursor: pointer; 
            font-size: 13.5px; 
            border-radius: 8px; 
            transition: all 0.2s; 
            margin-bottom: 4px; 
            box-sizing: border-box;
            font-weight: 500;
        }
        
        .nav-btn span {
            color: #1e293b; 
        }

        .nav-btn:hover, .nav-btn.active { 
            background: rgba(125, 211, 252, 0.3); 
            color: #0369a1; 
        }

        .nav-btn:hover span, .nav-btn.active span {
            color: #0369a1;
            font-weight: 600;
        }
        
        .nav-btn .completion-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: rgba(15, 23, 42, 0.15); 
            flex-shrink: 0;
            margin-left: 10px;
        }
        
        .nav-btn.completed .completion-dot { 
            background: #10b981; 
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); 
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: none;
            border: none;
            color: #0369a1; 
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 12px 6px;
            cursor: pointer;
            margin-top: 14px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(125, 211, 252, 0.3);
            text-align: left;
            line-height: 1.4;
            gap: 8px;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding-left: 2px;
        }

        .accordion-content.open {
            max-height: 500px; 
            transition: max-height 0.4s ease-in;
        }

        .accordion-arrow {
            transition: transform 0.2s ease;
            font-size: 10px;
            color: #0369a1;
            flex-shrink: 0;
        }

        .accordion-header.active .accordion-arrow {
            transform: rotate(90deg);
        }

        /* Welcome Pop-Up Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .welcome-card {
            background: #ffffff;
            width: 90%;
            max-width: 440px;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .welcome-title {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
        }

        .welcome-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .welcome-btn {
            background: #0369a1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .welcome-btn:hover {
            background: #0284c7;
        }

        .floating-note-popup {
            position: absolute;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 16px;
            width: 280px;
            z-index: 1000;
            display: none;
        }
        .floating-note-popup textarea {
            width: 100%; height: 70px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; resize: none; box-sizing: border-box; outline: none; font-family: inherit;
        }
        .floating-note-popup textarea:focus { border-color: #38bdf8; }

        .notes-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
        .journal-note-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; position: relative; }
        .journal-note-quote { font-size: 13px; font-style: italic; color: #64748b; border-left: 3px solid #38bdf8; padding-left: 12px; margin-bottom: 12px; }
        .journal-note-text { font-size: 14px; color: #1e293b; font-weight: 500; }
        .delete-journal-btn { position: absolute; top: 16px; right: 16px; background: #fee2e2; color: #ef4444; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
        
        .lesson-footer-bar { margin-top: 40px; padding-top: 24px; border-top: 2px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <script>
        let completedLessons = JSON.parse(localStorage.getItem('mono_completed_lessons')) || [];
        let studyNotes = JSON.parse(localStorage.getItem('mono_study_notes')) || [];
        let selectedQuoteText = ""; 
        let currentLessonId = null;
        
        const curriculum = [
            { id: "1.1", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.1: Introduction", desc: "Foundational concepts and basic principles." },
            { id: "1.2", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.2: The Accounting Equation", desc: "Assets, Liabilities, and Owner's Equity." },
            { id: "1.3", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.3: T-Accounts System", desc: "Visualize debits and credits clearly." },
            { id: "1.4", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.4: Journal and Ledger", desc: "Record and post financial transactions." },
            { id: "1.5", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.5: The Trial Balance", desc: "Verify ledger accuracy before statements." },
            { id: "1.6", module: 1, modName: "Module 1: Accounting Basics", name: "Lesson 1.6: Review and Quiz", desc: "Test your understanding of Module 1." },
            
            { id: "2.1", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.1: Intro to Financial Statements", desc: "Overview of core financial statements." },
            { id: "2.2", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.2: The Income Statement", desc: "Revenues, expenses, and net income." },
            { id: "2.3", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.3: The Balance Sheet", desc: "Organize assets, liabilities, and equity." },
            { id: "2.4", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.4: Statement of Owner's Equity", desc: "Track capital changes over time." },
            { id: "2.5", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.5: The Cash Flow Statement", desc: "Track cash from operating, investing, and financing." },
            { id: "2.6", module: 2, modName: "Module 2: Financial Statements", name: "Lesson 2.6: Module 2 Capstone", desc: "Construct integrated financial statements." },
            
            { id: "3.1", module: 3, modName: "Module 3: Ratio & Health", name: "Lesson 3.1: Liquidity & Capital", desc: "Short-term financial health and liquidity ratios." },
            { id: "3.2", module: 3, modName: "Module 3: Ratio & Health", name: "Lesson 3.2: Profitability Ratios", desc: "Assess margins and overall profit performance." },
            { id: "3.3", module: 3, modName: "Module 3: Ratio & Health", name: "Lesson 3.3: Efficiency Ratios", desc: "Evaluate operational velocity and asset turns." },
            { id: "3.4", module: 3, modName: "Module 3: Ratio & Health", name: "Lesson 3.4: Solvency Ratios", desc: "Long-term debt and structural solvency." },

            { id: "3.6", module: 3, modName: "Module 3: Ratio & Health", name: "Lesson 3.6: Investor Analysis", desc: "Evaluate target companies." },

            { id: "4.1", module: 4, modName: "Module 4: Assets, Liabilities & Equity", name: "Lesson 4.1: Inventory Costing Methods", desc: "FIFO, LIFO, and Weighted Average." },

        window.addEventListener('DOMContentLoaded', () => {
            checkWelcomeModal();
            loadDashboard();
            updateSidebarVisuals();
            updateNotesBadge();
            initHighlightListener();
        });

        function checkWelcomeModal() {
            const hasSeenModal = localStorage.getItem('mono_welcome_seen');
            if (!hasSeenModal) {
                setTimeout(() => {
                    document.getElementById('welcome-modal').classList.add('active');
                }, 200);
            }
        }

        function closeWelcomeModal() {
            document.getElementById('welcome-modal').classList.remove('active');
            localStorage.setItem('mono_welcome_seen', 'true');
        }

        function toggleAccordion(id, btn) {
            const panel = document.getElementById(id);
            btn.classList.toggle('active');
            panel.classList.toggle('open');
        }

        function updateNotesBadge() {
            const badge = document.getElementById("notes-counter-badge");
            if (badge) {
                badge.textContent = studyNotes.length;
                badge.style.background = studyNotes.length > 0 ? "#0284c7" : "rgba(15, 23, 42, 0.08)";
                badge.style.color = studyNotes.length > 0 ? "#ffffff" : "rgba(15, 23, 42, 0.6)";
            }
        }

        function loadDashboard() {
            currentLessonId = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('dashboard-nav-btn').classList.add('active');
            document.getElementById("main-scroll-viewport").scrollTop = 0;

            const container = document.getElementById("workbook-content-area");
            const totalCount = curriculum.length;
            const completedCount = completedLessons.length;
            const progressPercent = Math.round((completedCount / totalCount) * 100);

            const modulesMap = {};
            curriculum.forEach(lesson => {
                if (!modulesMap[lesson.module]) {
                    modulesMap[lesson.module] = { title: lesson.modName, lessons: [] };
                }
                modulesMap[lesson.module].lessons.push(lesson);
            });

            let modulesContentHtml = '';
            Object.keys(modulesMap).forEach(modId => {
                const mod = modulesMap[modId];
                modulesContentHtml += `
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 24px;">
                        <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #0369a1; border-bottom: 1px solid #bae6fd; padding-bottom: 8px; margin-bottom: 14px; text-align: left;">
                            ${mod.title}
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                `;

                mod.lessons.forEach(lesson => {
                    const isCompleted = completedLessons.includes(lesson.id);
                    modulesContentHtml += `
                        <div style="background: #ffffff; border: 1px solid ${isCompleted ? '#cbd5e1' : '#e2e8f0'}; padding: 14px 18px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left;">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: ${isCompleted ? '#dcfce7' : '#f1f5f9'}; color: ${isCompleted ? '#166534' : '#64748b'};">
                                        ${isCompleted ? '✓ Completed' : 'Pending'}
                                    </span>
                                    <h4 style="margin: 0; font-size: 14.5px; font-weight: 700; color: #0f172a;">${lesson.name}</h4>
                                </div>
                                <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b; line-height: 1.4;">${lesson.desc}</p>
                            </div>
                            <button onclick="loadLessonContent('${lesson.id}')" style="background: #0f172a; color: white; border: none; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; flex-shrink: 0; transition: background 0.2s;">
                                ${isCompleted ? 'Review' : 'Start'}
                            </button>
                        </div>
                    `;
                });

                modulesContentHtml += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <h1 style="margin: 0 0 6px 0; font-size: 26px; font-weight: 800; color: #0f172a;">Dashboard</h1>
                <p style="color: #64748b; margin-top: 0; margin-bottom: 24px;">Your learning overview and module progress.</p>
                
                <div style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); padding: 24px; border-radius: 12px; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
                    <div>
                        <h2 style="margin: 0 0 8px 0; font-size: 20px;">Progress: ${progressPercent}%</h2>
                        <div style="width: 240px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden;">
                            <div style="width: ${progressPercent}%; height: 100%; background: white;"></div>
                        </div>
                    </div>
                    <div style="background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 8px; text-align: center;">
                        <span style="font-size: 22px; font-weight: 800;">${completedCount} / ${totalCount}</span>
                    </div>
                </div>
                ${modulesContentHtml}
            `;
        }

        function loadLessonContent(lessonId) {
            currentLessonId = lessonId;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-${lessonId}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById("main-scroll-viewport").scrollTop = 0;
            const container = document.getElementById("workbook-content-area");
            
            let fileName = "";
            if(lessonId === "final_exam") {
                fileName = `lessons/final_exam.html?t=${Date.now()}`;
            } else {
                const parts = String(lessonId).split('.');
                fileName = `lessons/Lesson${parts[0]}_${parts[1]}.html?t=${Date.now()}`;
            }

            fetch(fileName, { cache: "no-store" })
                .then(response => {
                    if (!response.ok) throw new Error(`Missing page: ${fileName}`);
                    return response.text();
                })
                .then(html => {
                    const isCompleted = completedLessons.includes(lessonId);
                    
                    const completeFooterHtml = `
                        <div class="lesson-footer-bar">
                            <span style="font-size: 13px; color: #64748b; font-weight: 500;">
                                ${isCompleted ? '✓ Lesson Completed' : 'Finished reading? Mark this lesson as complete:'}
                            </span>
                            <button id="complete-btn" onclick="toggleLessonCompletion('${lessonId}')" style="background: ${isCompleted ? '#dcfce7' : '#0f172a'}; color: ${isCompleted ? '#166534' : '#ffffff'}; border: 1px solid ${isCompleted ? '#86efac' : '#0f172a'}; padding: 10px 20px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                                ${isCompleted ? '✓ Completed' : 'Complete & Continue →'}
                            </button>
                        </div>
                    `;

                    container.innerHTML = html + completeFooterHtml;
                    updateSidebarVisuals();
                })
                .catch(err => {
                    container.innerHTML = `<div style="text-align: center; padding: 40px;"><h3 style="color:#ef4444;">Lesson Not Found</h3><p style="color:#64748b;">${err.message}</p></div>`;
                });
        }

        function toggleLessonCompletion(lessonId) {
            if (!completedLessons.includes(lessonId)) {
                completedLessons.push(lessonId);
            } else {
                completedLessons = completedLessons.filter(id => id !== lessonId);
            }
            
            localStorage.setItem('mono_completed_lessons', JSON.stringify(completedLessons));
            updateSidebarVisuals();

            // Auto navigate to next lesson if completing
            const currentIndex = curriculum.findIndex(l => l.id === lessonId);
            if (completedLessons.includes(lessonId) && currentIndex !== -1 && currentIndex < curriculum.length - 1) {
                const nextLesson = curriculum[currentIndex + 1];
                loadLessonContent(nextLesson.id);
            } else {
                loadLessonContent(lessonId);
            }
        }

        function updateSidebarVisuals() {
            curriculum.forEach(lesson => {
                const btn = document.getElementById(`nav-${lesson.id}`);
                if (btn) {
                    if (completedLessons.includes(lesson.id)) {
                        btn.classList.add('completed');
                    } else {
                        btn.classList.remove('completed');
                    }
                }
            });
        }

        function initHighlightListener() {
            document.addEventListener('mouseup', (e) => {
                const selectedText = window.getSelection().toString().trim();
                const popup = document.getElementById('floating-note-box');
                
                if (selectedText.length > 3 && !popup.contains(e.target)) {
                    selectedQuoteText = selectedText;
                    document.getElementById('popup-selected-text').textContent = `"${selectedText}"`;
                    
                    popup.style.left = `${Math.min(e.pageX, window.innerWidth - 300)}px`;
                    popup.style.top = `${e.pageY + 10}px`;
                    popup.style.display = 'block';
                }
            });
        }

        function closeNotePopup() {
            document.getElementById('floating-note-box').style.display = 'none';
            document.getElementById('popup-note-input').value = '';
            selectedQuoteText = "";
        }

        function saveNote() {
            const input = document.getElementById('popup-note-input').value.trim();
            if (input && selectedQuoteText) {
                studyNotes.push({
                    id: Date.now(),
                    quote: selectedQuoteText,
                    text: input,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('mono_study_notes', JSON.stringify(studyNotes));
                updateNotesBadge();
                closeNotePopup();
            }
        }

        function loadNotesPage() {
            currentLessonId = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-notes').classList.add('active');
            
            const container = document.getElementById("workbook-content-area");
            
            let notesHtml = studyNotes.length === 0 
                ? `<p style="color: #64748b; font-style: italic;">No study notes saved yet. Highlight any text in a lesson to add a note.</p>`
                : `<div class="notes-grid">` + studyNotes.map(note => `
                    <div class="journal-note-card">
                        <button class="delete-journal-btn" onclick="deleteNote(${note.id})">Delete</button>
                        <div class="journal-note-quote">"${note.quote}"</div>
                        <div class="journal-note-text">${note.text}</div>
                        <div style="font-size: 11px; color: #94a3b8; margin-top: 10px;">${note.date}</div>
                    </div>
                `).join('') + `</div>`;

            container.innerHTML = `
                <h1 style="margin: 0 0 6px 0; font-size: 26px; font-weight: 800; color: #0f172a;">📝 My Study Notes</h1>
                <p style="color: #64748b; margin-top: 0; margin-bottom: 24px;">Highlights and personal study notes.</p>
                ${notesHtml}
            `;
        }

        function deleteNote(id) {
            studyNotes = studyNotes.filter(n => n.id !== id);
            localStorage.setItem('mono_study_notes', JSON.stringify(studyNotes));
            updateNotesBadge();
            loadNotesPage();
        }

        // Send a heartbeat ping to Umami every 15 seconds to log session duration accurately
        setInterval(() => {
            if (document.visibilityState === 'visible' && window.umami) {
                umami.track('ping');
            }
        }, 15000);
    </script>
</body>
</html>
