<div class="lesson26-root"><div class="scroll-reveal-card" style="margin-top:0;"><span style="background:#ede9fe; color:#6d28d9; font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:0.05em;">Lesson 2.6</span><h2 style="margin:12px 0 8px 0; font-size:26px; color:#0f172a; font-weight:800;">Financial Statement Challenge</h2><p style="line-height:1.6; color:#475569; font-size:15px; margin:0;">Review and apply what you learned by building the core financial statements step by step.</p></div><div class="scroll-reveal-card" style="background:#fff; border:1px solid #f1f5f9; border-radius:20px; padding:28px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.02); margin-top:24px; position:relative; overflow:hidden;"><div class="progress-dots">
<span class="dot active" id="dot-1"></span>
<span class="dot" id="dot-2"></span>
<span class="dot" id="dot-3"></span>
<span class="dot" id="dot-4"></span>
</div><div class="card">
<h2 id="stage-title">Stage 1: Build the Income Statement</h2>
<p id="stage-desc">Place the appropriate items to finish the Income Statement framework.</p>
</div></div><div class="scroll-reveal-card" style="background:#fff; border:1px solid #f1f5f9; border-radius:20px; padding:28px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.02); margin-top:24px; position:relative; overflow:hidden;"><div class="bank-area" id="options-bank" style="background:#f8fafc; border:2px dashed #cbd5e1; border-radius:12px; padding:15px; margin-bottom:20px; text-align:center;"></div><div class="scroll-reveal-card" style="overflow-x:auto; margin:0; padding:0; box-shadow:none; border:0;">
<table class="interactive-table" id="statement-table"></table>
</div><div style="text-align:center; margin-top:24px;">
<button class="btn-action" onclick="verifyStage()" style="background:#6d28d9; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:700; margin:4px;">Verify Structure</button>
<button class="btn-action" id="next-stage-btn" onclick="advanceStage()" style="background:#6d28d9; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:700; margin:4px;">Next Statement →</button>
<p class="feedback" id="stage-feedback"></p>
</div></div><style>.lesson26-root .progress-dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}.lesson26-root .dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;display:block}.lesson26-root .dot.active{background:#6d28d9}.lesson26-root .dot.completed{background:#16a34a}.lesson26-root .bank-item{display:inline-block;padding:8px 16px;margin:5px;background:#ede9fe;border:2px solid #ddd6fe;color:#6d28d9;border-radius:8px;cursor:pointer;font-weight:700}.lesson26-root .bank-item.selected{transform:scale(.95);opacity:.6;border-style:dashed}.lesson26-root .drop-zone{display:inline-block;width:160px;min-height:35px;border:2px dashed #cbd5e1;border-radius:6px;vertical-align:middle;text-align:center;line-height:35px;background:#fff;cursor:pointer;font-weight:700;color:#6d28d9;padding:0 6px}.lesson26-root .drop-zone.filled{border-style:solid}.lesson26-root .feedback{font-weight:700;margin-top:15px}</style><script>
    const stages = [
      {
        title: "Stage 1: Build the Income Statement",
        desc: "Build the Income Statement from the top line to the bottom line.",
        headers: ["Line Item Description", "Amount / Type"],
        bank: ["Gross Revenue / Sales", "Cost of Goods Sold (COGS)", "Gross Profit", "Operating Expenses (OpEx)", "Operating Income", "Interest & Taxes", "Net Income"],
        rows: [
          { label: "1. Revenue Header:", target: "Gross Revenue / Sales" },
          { label: "2. Cost subtracted directly from revenue:", target: "Cost of Goods Sold (COGS)" },
          { label: "3. First intermediate profit margin:", target: "Gross Profit" },
          { label: "4. Day-to-day administrative overhead:", target: "Operating Expenses (OpEx)" },
          { label: "5. Profit generated from core operations:", target: "Operating Income" },
          { label: "6. Non-operating costs:", target: "Interest & Taxes" },
          { label: "7. The bottom line profit value:", target: "Net Income" }
        ]
      },
      {
        title: "Stage 2: Build the Balance Sheet",
        desc: "Construct the central elements of the Accounting Equation.",
        headers: ["Accounting Block", "Target Placement Group"],
        bank: ["Current Assets", "Fixed Assets", "Total Assets", "Current Liabilities", "Long-Term Liabilities", "Total Liabilities", "Shareholders' Equity"],
        rows: [
          { label: "1. Liquid assets (cash, receivables):", target: "Current Assets" },
          { label: "2. Long-lived property & equipment:", target: "Fixed Assets" },
          { label: "3. Left side of the accounting equation:", target: "Total Assets" },
          { label: "4. Debts due in under 12 months:", target: "Current Liabilities" },
          { label: "5. Multi-year loan obligations:", target: "Long-Term Liabilities" },
          { label: "6. All creditors' claims:", target: "Total Liabilities" },
          { label: "7. Owners' net interest inside the firm:", target: "Shareholders' Equity" }
        ]
      },
      {
        title: "Stage 3: Build the Statement of Owner's Equity",
        desc: "Detail the chronological changes in the owner's net worth.",
        headers: ["Equity Event Transaction", "Target Category"],
        bank: ["Beginning Capital", "Additions", "Net Income", "Less: Owner Withdrawals", "Ending Capital"],
        rows: [
          { label: "1. Asset value of ownership on day 1:", target: "Beginning Capital" },
          { label: "2. Fresh owner investments:", target: "Additions" },
          { label: "3. Income brought from income statement:", target: "Net Income" },
          { label: "4. Assets extracted for personal use:", target: "Less: Owner Withdrawals" },
          { label: "5. Final equity carried to balance sheet:", target: "Ending Capital" }
        ]
      },
      {
        title: "Stage 4: Build the Cash Flow Statement",
        desc: "Assemble the foundational segments that track actual liquidity flow.",
        headers: ["Transaction Channel", "Category Group"],
        bank: ["Operating Activities", "Investing Activities", "Financing Activities", "Net Cash Reconciliation"],
        rows: [
          { label: "1. Core transactional customer revenue:", target: "Operating Activities" },
          { label: "2. Buying long-term warehouse properties:", target: "Investing Activities" },
          { label: "3. Issuing equity shares to general public:", target: "Financing Activities" },
          { label: "4. Final verification against balance sheet cash:", target: "Net Cash Reconciliation" }
        ]
      }
    ];

    let currentStage = 0;
    let selectedVal = "";
    let selectedEl = null;

    function initStage() {
      const stage = stages[currentStage];
      
      document.getElementById('stage-title').innerText = stage.title;
      document.getElementById('stage-desc').innerText = stage.desc;
      document.getElementById('stage-feedback').innerText = "";
      document.getElementById('next-stage-btn').style.display = 'none';

      // Load Bank
      const bankDiv = document.getElementById('options-bank');
      let randomizedBank = [...stage.bank].sort(() => Math.random() - 0.5);
      bankDiv.innerHTML = randomizedBank.map(item => `
        <div class="bank-item" onclick="selectItem('${item.replace(/'/g, "\\'")}', this)">${item}</div>
      `).join('');

      // Load Table
      const table = document.getElementById('statement-table');
      let tableHtml = `
        <thead>
          <tr>
            <th>${stage.headers[0]}</th>
            <th>${stage.headers[1]}</th>
          </tr>
        </thead>
        <tbody>
      `;

      stage.rows.forEach((row, i) => {
        tableHtml += `
          <tr>
            <td><strong>${row.label}</strong></td>
            <td><div class="drop-zone" id="slot-${i}" onclick="placeItem('slot-${i}')">?</div></td>
          </tr>
        `;
      });

      tableHtml += `</tbody>`;
      table.innerHTML = tableHtml;
      
      selectedVal = "";
      selectedEl = null;
    }

    function selectItem(val, el) {
      if (selectedEl) selectedEl.classList.remove('selected');
      selectedVal = val;
      selectedEl = el;
      el.classList.add('selected');
    }

    function placeItem(slotId) {
      if (!selectedVal) {
        alert("Select a block from the bank first!");
        return;
      }
      const slot = document.getElementById(slotId);
      slot.innerText = selectedVal;
      slot.classList.add('filled');
      
      if (selectedEl) {
        selectedEl.classList.remove('selected');
        selectedEl = null;
        selectedVal = "";
      }
    }

    function verifyStage() {
      const stage = stages[currentStage];
      let allCorrect = true;

      stage.rows.forEach((row, i) => {
        const value = document.getElementById(`slot-${i}`).innerText;
        if (value !== row.target) {
          allCorrect = false;
        }
      });

      const feedback = document.getElementById('stage-feedback');
      if (allCorrect) {
        feedback.style.color = "var(--success)";
        feedback.innerText = "Excellent Work! That statement is structurally perfect.";
        document.getElementById('next-stage-btn').style.display = 'inline-block';
        document.getElementById(`dot-${currentStage + 1}`).className = "dot completed";
      } else {
        feedback.style.color = "red";
        feedback.innerText = "Error detected! Double check your logical arrangement.";
      }
    }

    function advanceStage() {
      currentStage++;
      if (currentStage < stages.length) {
        document.getElementById(`dot-${currentStage + 1}`).className = "dot active";
        initStage();
      } else {
        document.getElementById('options-bank').style.display = 'none';
        document.getElementById('statement-table').style.display = 'none';
        document.getElementById('next-stage-btn').style.display = 'none';
        
        document.getElementById('stage-title').innerText = "🏆 Masterclass Finished!";
        document.getElementById('stage-desc').innerText = "You have perfectly built all four core financial statements from scratch. Outstanding work!";
        document.getElementById('stage-feedback').innerHTML = "All 4 modules validated perfectly.";
      }
    }

    initStage();
  </script></div>
