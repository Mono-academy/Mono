<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance - Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .announcement-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 500px;
      width: 100%;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .announcement-card h1 {
      color: #1e3a8a;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .announcement-card p {
      color: #475569;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <main class="announcement-card">
    <h1>Personal Finance lessons coming soon!</h1>
    <p>Explore Accounting while you wait!</p>
  </main>

</body>
</html>
